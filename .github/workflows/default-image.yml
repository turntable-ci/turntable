# Builds images/ubuntu-24.04 on every change to it and smoke-tests the result. On main it builds,
# smoke-tests the local image by its ID digest, and only then tags and pushes it to GHCR, through the
# same `release` environment and PUBLISH_FROM_GITHUB gate as the release image (#809).
name: default-image

on:
  pull_request:
    paths: ["images/ubuntu-24.04/**"]
  push:
    branches: [main]
    paths: ["images/ubuntu-24.04/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: default-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Pull requests only: main goes through `publish`, which builds and smoke-tests the same way.
    # Not under Turntable: building an image needs Docker, which its sandboxes lack.
    if: github.event_name == 'pull_request' && vars.TURNTABLE_CI != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (not pushed)
        run: docker build -t turntable-ubuntu-24.04:ci images/ubuntu-24.04
      - name: Smoke test (toolchain, turntable-svc postgres, redis, mysql)
        run: docker run --rm -v "$PWD/images/ubuntu-24.04/smoke.sh:/smoke.sh:ro" turntable-ubuntu-24.04:ci bash /smoke.sh # pin-ok: the image built by the step above

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.TURNTABLE_CI != 'true' && vars.PUBLISH_FROM_GITHUB == 'true'
    # Publishes an image: gated by the same environment as the release image.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/turntable-ci/turntable-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built into the local Docker store only: nothing reaches GHCR until the smoke test passes.
      - name: Build the image (local, not pushed)
        run: docker build --iidfile "$RUNNER_TEMP/image-id" images/ubuntu-24.04
      - name: Smoke test the built image by its digest
        run: |
          ID="$(cat "$RUNNER_TEMP/image-id")"
          docker run --rm -v "$PWD/images/ubuntu-24.04/smoke.sh:/smoke.sh:ro" "$ID" bash /smoke.sh # pin-ok: the image ID built by the step above
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only now tag and push the image that passed. The tag is a label for people; Turntable
      # registers and runs the image by digest.
      - id: push
        run: |
          ID="$(cat "$RUNNER_TEMP/image-id")"
          TAG="${IMAGE}:24.04-${GITHUB_SHA}"
          docker tag "$ID" "$TAG"
          docker push "$TAG"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$TAG" | sed 's/.*@//')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/turntable-ci/turntable-ubuntu-24.04
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: The digest to register
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "${IMAGE}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
